plugins { id 'com.android.application' }

android {
    namespace 'app.tvreminders'
    compileSdk 34

    defaultConfig {
        applicationId 'app.tvreminders'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded on the TV, never published: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
