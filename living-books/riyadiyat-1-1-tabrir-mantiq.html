<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الكتاب الحيّ: التبرير الاستقرائي والمنطق</title>
<style>
:root{
  --desk1:#d8c8ab; --desk2:#b9a583; --cover:#6b3f2a; --cover2:#51301f;
  --paper:#fbf4e4; --paper2:#f1e6cf; --edge:#e2d5b8; --line:#d6c8ab;
  --ink:#2f2a24; --muted:#7b6f5e; --pencil:#4b463f; --hatch:#8d857a;
  --c-pat:#2b6cb0; --c-cx:#c0392b; --c-p:#16806a; --c-q:#cf7a1f; --c-neg:#7a4bb0;
  --c-t:#2e9e5b; --c-f:#9b9082; --glow:#ffd95e; --chip:#efe3c8; --shadow:rgba(60,40,15,.35);
  --font:"Noto Naskh Arabic","Geeza Pro","Segoe UI","Tahoma","Arial",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --desk1:#221c16; --desk2:#15110d; --cover:#3c2418; --cover2:#2a1810;
  --paper:#2e2922; --paper2:#27221c; --edge:#3b342b; --line:#4b4337;
  --ink:#f0e7d6; --muted:#ab9f8b; --pencil:#ddd4c3; --hatch:#958b7b;
  --c-pat:#6fb0f0; --c-cx:#f08a7c; --c-p:#56c9ae; --c-q:#f0a85a; --c-neg:#b995ee;
  --c-t:#63d08e; --c-f:#7d7466; --glow:#ffd95e; --chip:#3a332a; --shadow:rgba(0,0,0,.6);
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(120% 90% at 50% 20%,var(--desk1),var(--desk2));
  overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;-webkit-tap-highlight-color:transparent;user-select:none}
button,input,select{font-family:inherit;color:inherit}
bdi{unicode-bidi:isolate}
header{padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink)}
header b{font-size:15px}
header span{color:var(--muted);font-size:12px;white-space:nowrap}
body.teacher header{display:none}
body.teacher{grid-template-rows:1fr auto}
body.short #stage{overflow-y:auto;touch-action:auto}
body.short #book{top:11px;margin-top:0}
body.short header{display:none}
body.short{grid-template-rows:1fr auto}
@media (max-width:600px){header span{display:none}}

/* ---------- stage and book ---------- */
#stage{position:relative;overflow:hidden;perspective:2200px;perspective-origin:50% 30%;touch-action:pan-y}
#book{position:absolute;left:50%;top:50%;width:calc(var(--pw)*2);height:var(--ph);margin:calc(var(--ph)/-2) 0 0 calc(var(--pw)*-1);
  transform-style:preserve-3d;transform:translateX(var(--shift,0px)) rotateX(var(--tilt,13deg));transition:transform .7s cubic-bezier(.3,.7,.2,1);
  font-size:var(--fs)}
#cover{position:absolute;inset:-1.1% -1.2% -2.2% -1.2%;background:linear-gradient(var(--cover),var(--cover2));border-radius:1em;
  box-shadow:0 2.4em 3em -1em var(--shadow),0 .5em 0 var(--cover2);transform:translateZ(-6px)}
.block{position:absolute;top:0;width:50%;height:100%;background:var(--edge);transform:translateZ(-3px);
  box-shadow:0 .25em 0 var(--line),0 .5em 0 var(--edge),0 .75em 0 var(--line)}
.block.r{right:0;border-radius:0 .5em .5em 0}.block.l{left:0;border-radius:.5em 0 0 .5em}
.sheet{position:absolute;top:0;width:50%;height:100%;transform-style:preserve-3d}
.sheet.static{transform:translateZ(0)}
.sheet.static.r{right:0}.sheet.static.l{left:0}
.leaf{left:0;transform-origin:100% 50%;transform:rotateY(0deg) translateZ(var(--zu));pointer-events:none}
.leaf.flipped{transform:rotateY(180deg) translateZ(var(--zf))}
@keyframes flipF{0%{transform:rotateY(0deg) translateZ(var(--zu)) skewY(0deg)}50%{transform:rotateY(90deg) translateZ(4px) skewY(-5deg)}100%{transform:rotateY(180deg) translateZ(var(--zf)) skewY(0deg)}}
@keyframes flipB{0%{transform:rotateY(180deg) translateZ(var(--zf)) skewY(0deg)}50%{transform:rotateY(90deg) translateZ(4px) skewY(-5deg)}100%{transform:rotateY(0deg) translateZ(var(--zu)) skewY(0deg)}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;pointer-events:none;
  background:linear-gradient(90deg,var(--paper2),var(--paper) 9%,var(--paper) 100%);padding:1.25em 1.3em 1.1em;display:flex;flex-direction:column;gap:.55em}
.sheet.l .face.front,.leaf .face.front{border-radius:.45em 0 0 .45em;background:linear-gradient(270deg,var(--paper2),var(--paper) 9%,var(--paper) 100%)}
.face.back{transform:rotateY(180deg);border-radius:0 .45em .45em 0}
.sheet.static.r .face{border-radius:0 .45em .45em 0}
.leaf.flipped .front,.leaf:not(.flipped) .back{visibility:hidden;transition:visibility 0s .45s}
.leaf .front,.leaf .back{transition:visibility 0s .45s}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(90deg,rgba(0,0,0,.16),transparent 30%,rgba(255,255,255,.12) 60%,rgba(0,0,0,.12));opacity:0}
.leaf.turning .face::after{animation:sheen .9s ease-in-out}
@keyframes sheen{50%{opacity:1}}
.face.live{pointer-events:auto}
.leaf.far{visibility:hidden}
.pgno{position:absolute;bottom:.45em;font-size:.7em;color:var(--muted)}
.back .pgno,.static.r .pgno{left:1.2em}.front .pgno{right:1.2em}

/* ---------- text page ---------- */
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.6em;padding-inline-end:.2em;scrollbar-width:thin}
.kick{font-size:.78em;color:var(--muted);letter-spacing:.02em}
h2{font-size:1.55em;line-height:1.35;font-weight:700}
.txt p{font-size:1em;line-height:1.85}
.law{border:1.5px solid var(--pencil);border-radius:.5em;padding:.6em .8em;font-size:1.05em;line-height:1.8;font-weight:700;
  background:repeating-linear-gradient(135deg,transparent 0 .5em,rgba(125,110,80,.07) .5em .55em)}
.law small{display:block;font-weight:400;font-size:.8em;color:var(--muted)}
.note{border-inline-start:3px solid var(--c-q);padding:.3em .7em;font-size:.84em;line-height:1.7;color:var(--muted);transform:rotate(-.6deg)}
.ref{font-size:.74em;color:var(--muted);margin-top:auto}
.k-pat{color:var(--c-pat)}.k-cx{color:var(--c-cx)}.k-p{color:var(--c-p)}.k-q{color:var(--c-q)}.k-neg{color:var(--c-neg)}
ul.plain{list-style:none;display:flex;flex-direction:column;gap:.35em;font-size:.92em;line-height:1.7}
ul.plain li::before{content:"✎ ";color:var(--muted)}

/* ---------- lab page ---------- */
.labh{display:flex;align-items:baseline;justify-content:space-between;gap:.6em}
.labh h3{font-size:1.15em}.labh small{color:var(--muted);font-size:.72em}
.predict{position:relative;border:1.5px dashed var(--pencil);border-radius:.5em;padding:.45em .7em .5em;font-size:.86em;line-height:1.65;transform-style:preserve-3d}
.predict .q b,.predict .a b{font-weight:700}
.slot{position:relative;margin-top:.35em;min-height:2.5em;transform-style:preserve-3d}
.slot .a{padding:.35em .6em;border-radius:.4em;background:var(--chip);min-height:2.5em}
.flap{position:absolute;inset:0;border:1.5px solid var(--pencil);border-radius:.4em;background:var(--paper2);cursor:pointer;font-size:1em;font-weight:700;
  transform-origin:50% 0;transition:transform .6s cubic-bezier(.3,.8,.3,1.2),box-shadow .6s;box-shadow:0 .15em .3em var(--shadow);
  background-image:repeating-linear-gradient(135deg,transparent 0 .45em,rgba(125,110,80,.12) .45em .5em)}
.predict.open .flap{transform:rotateX(-128deg);box-shadow:0 -1em 1em -0.8em var(--shadow)}
.tabs{display:flex;gap:.35em;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--pencil);background:transparent;border-radius:.5em .5em 0 0;padding:.2em .7em;font-size:.82em;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--pencil);color:var(--paper)}
.popwrap{flex:1;min-height:6.5em;position:relative;transform-style:preserve-3d}
.pshadow{position:absolute;left:3%;right:3%;bottom:0;height:70%;background:radial-gradient(60% 60% at 50% 100%,var(--shadow),transparent 70%);
  transform-origin:50% 100%;transform:scaleY(.1);opacity:0;transition:all .9s ease .3s;filter:blur(6px)}
.hinge{position:absolute;left:0;right:0;bottom:-.25em;height:.5em;border-top:1.5px dashed var(--hatch)}
.pop{position:absolute;inset:0;transform-origin:50% 100%;transform:rotateX(0deg);transition:transform .95s cubic-bezier(.25,.9,.3,1.25) .3s,box-shadow .9s .3s;
  background:var(--paper);border:1.5px solid var(--pencil);border-radius:.5em .5em .15em .15em;padding:.3em;display:flex;backface-visibility:hidden}
.pop svg{flex:1;min-width:0;min-height:0;width:100%;height:100%;display:block}
.active .pop{transform:rotateX(-21deg);box-shadow:0 1.6em 1.6em -1.2em var(--shadow)}
.active .pshadow{opacity:.75;transform:scaleY(.55) skewX(-10deg)}
.ctl{display:flex;flex-direction:column;gap:.3em;font-size:.84em}
.row{display:flex;align-items:center;gap:.6em}
.row label{flex:0 0 auto;min-width:6.2em}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--c-pat);height:1.6em;touch-action:none}
.row output{flex:0 0 3.2em;text-align:center;font-weight:700;direction:ltr}
.chips{display:flex;gap:.35em;flex-wrap:wrap}
.chips button,.btn{border:1.5px solid var(--pencil);background:var(--chip);border-radius:1em;padding:.22em .75em;font-size:.95em;cursor:pointer;line-height:1.5}
.chips button[aria-pressed=true]{background:var(--pencil);color:var(--paper)}
.sw{border-radius:.5em!important;min-width:4.6em;font-weight:700;direction:ltr}
.sw.T{background:var(--c-t)!important;color:#fff;border-color:var(--c-t)!important}
.sw.F{background:var(--c-f)!important;color:#fff;border-color:var(--c-f)!important}
select{border:1.5px solid var(--pencil);background:var(--chip);border-radius:.5em;padding:.2em .4em;font-size:.95em;direction:ltr}
.out{border-top:1.5px solid var(--line);padding-top:.35em;font-size:.86em;line-height:1.7;min-height:4.9em}
.out b{font-weight:700}.ok{color:var(--c-t);font-weight:700}.no{color:var(--c-cx);font-weight:700}
.quiz{flex:1;display:flex;flex-direction:column;gap:.4em;padding:.4em .6em;font-size:.9em;min-height:0;overflow:auto}
.quiz .qq{font-weight:700;line-height:1.7}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.quiz .opts button{border:1.5px solid var(--pencil);background:var(--chip);border-radius:.5em;padding:.35em .4em;font-size:1em;cursor:pointer;line-height:1.5}
.quiz .opts button.right{background:var(--c-t);color:#fff;border-color:var(--c-t)}
.quiz .opts button.wrong{background:var(--c-cx);color:#fff;border-color:var(--c-cx)}
.quiz .why{font-size:.9em;line-height:1.6;color:var(--muted);min-height:1.6em}
.stars{font-size:2.6em;letter-spacing:.15em;text-align:center;color:var(--glow);text-shadow:0 0 .2em rgba(255,200,60,.6),0 .05em 0 var(--pencil);direction:ltr}
.stars i{font-style:normal;color:var(--line);text-shadow:none}

/* ---------- svg pencil style ---------- */
svg text{font-family:var(--font);fill:var(--ink);direction:ltr}
.pc{fill:none;stroke:var(--pencil);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pd{stroke-dasharray:4 4}
.lt{stroke-width:.8;stroke:var(--hatch)}
.sm{font-size:9px}.md{font-size:11px}.lg{font-size:14px;font-weight:700}
.mu{fill:var(--muted)}

/* ---------- bottom bar ---------- */
#bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
#bar button{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;min-width:44px;height:40px;padding:0 14px;font-size:14px;cursor:pointer}
#bar button:disabled{opacity:.35;cursor:default}
#bar button:focus-visible,.chips button:focus-visible,.tabs button:focus-visible,.flap:focus-visible,.quiz button:focus-visible{outline:3px solid var(--c-pat);outline-offset:2px}
#dots{display:flex;gap:6px;direction:rtl}
#dots i{width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.25}
#dots i.on{opacity:1}
#teach[aria-pressed=true]{background:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>
</head>
<body>
<header><b>الكتاب الحيّ · الرياضيات <bdi dir="ltr">1-1</bdi></b><span>التبرير الاستقرائي والتخمين · المنطق</span></header>
<div id="stage"><div id="book"><div id="cover"></div><div class="block r"></div><div class="block l"></div></div></div>
<div id="bar">
  <button id="prev" aria-label="الصفحة السابقة">▶ السابق</button>
  <div id="dots" aria-hidden="true"></div>
  <button id="next" aria-label="الصفحة التالية">التالي ◀</button>
  <button id="teach" aria-pressed="false">وضع المعلم</button>
  <button id="mute" aria-pressed="false" aria-label="كتم الصوت">🔊</button>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--hatch)" stroke-width="1"/>
    </pattern>
    <pattern id="hatchP" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--c-p)" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatchQ" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--c-q)" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatchB" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--c-pat)" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatchR" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--c-cx)" stroke-width="1.6"/>
    </pattern>
  </defs>
</svg>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const B=s=>`<bdi dir="ltr">${s}</bdi>`;
const SVG=(inner,w=340,h=200)=>`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img"><g filter="url(#rough)">${inner}</g></svg>`;
const T=(x,y,s,cls="md",extra="")=>`<text x="${x}" y="${y}" text-anchor="middle" class="${cls}" ${extra}>${s}</text>`;

/* ================= content: text pages ================= */
const TEXT=[
{k:"الفصل ١ · الدرس "+B("1-1"),h:"هل تستطيع أن تتنبأ؟",ref:"كتاب الطالب ص "+B("12"),
 body:`<p>أنت في محطة الحافلات. مرّت أربع حافلات في مواعيد منتظمة. من دون جدول، هل تعرف متى تأتي الخامسة؟</p>
 <p>حين تلاحظ أمثلة محددة ثم تصل منها إلى نتيجة، فأنت تستعمل <b class="k-pat">التبرير الاستقرائي</b>. والعبارة التي تصل إليها تسمى <b class="k-pat">تخميناً</b>.</p>
 <div class="law">ابحث عن نمط ← ضع تخميناً ← جد الحد التالي<small>الخطوات الثلاث في مثال ${B("1")}</small></div>
 <div class="note">المتتابعة: مجموعة من الأعداد أو الأشياء المنظمة بترتيب معين.</div>
 <div class="note">من تاريخ الرياضيات: ابن الهيثم اعتمد في بحوثه على الاستقراء والاستنباط، مع التجربة والملاحظة.</div>`},
{k:"الفصل ٢ · الدرس "+B("1-1"),h:"تخمينات من أعداد وأشكال وبيانات",ref:"كتاب الطالب ص "+B("13")+" و "+B("14"),
 body:`<p>لتضع تخميناً جبرياً أو هندسياً: اكتب أمثلة، ثم ابحث عن نمط.</p>
 <p>وفي الحياة تعتمد التخمينات على بيانات تُجمع حول الموضوع، والتمثيل البياني يساعدك على رؤية النمط.</p>
 <div class="law">ناتج جمع عددين فرديين هو عدد زوجي.<br>القطعتان الواصلتان بين كل رأسين متقابلين في المستطيل متطابقتان.<small>تخمينا مثال ${B("2")}</small></div>
 <div class="note">الأمثلة المؤيدة للتخمين ليست كافية لإثبات صحته. الإثبات يحتاج إلى برهان، وستتعلمه في الدرس ${B("1-5")}.</div>`},
{k:"الفصل ٣ · الدرس "+B("1-1"),h:"مثال واحد يكفي للهدم",ref:"كتاب الطالب ص "+B("15"),
 body:`<p>لإثبات صحة تخمين في كل الحالات تحتاج إلى برهان. أما لإثبات أنه خاطئ فيكفي مثال واحد معاكس له.</p>
 <p>هذا المثال يسمى <b class="k-cx">المثال المضاد</b>، وقد يكون عدداً أو رسماً أو عبارة.</p>
 <div class="law">التخمين: إذا كان ${B("n")} عدداً حقيقياً فإن ${B("n² &gt; n")}<br><span class="k-cx">مثال مضاد: ${B("n = 1")} لأن ${B("1² ≯ 1")}</span><small>مثال ${B("4")}</small></div>
 <div class="note">المعنى اللغوي: المضاد هو المخالف. المعنى الرياضي: مثال معاكس لمثال معطى.</div>`},
{k:"الفصل ٤ · الدرس "+B("1-2"),h:"صائبة أم خاطئة؟",ref:"كتاب الطالب ص "+B("19")+" إلى "+B("21"),
 body:`<p><b>العبارة</b> جملة خبرية إما صائبة ${B("(T)")} وإما خاطئة ${B("(F)")}، ولا تحتمل حالة أخرى. وهذه هي <b>قيمة الصواب</b> لها.</p>
 <p><b class="k-neg">نفي العبارة</b> ${B("~p")} له عكس قيمة صوابها. و<b>عبارة الوصل</b> ${B("p ∧ q")} تربط بـ(و)، و<b>عبارة الفصل</b> ${B("p ∨ q")} تربط بـ(أو).</p>
 <div class="law">${B("p ∧ q")} صائبة فقط إذا كانت جميع العبارات المكونة لها صائبة.<br>${B("p ∨ q")} خاطئة فقط إذا كانت جميع العبارات المكونة لها خاطئة.</div>
 <div class="note">جدول الصواب ينظّم كل حالات قيم الصواب للعبارات.</div>`},
{k:"الفصل ٥ · الدرس "+B("1-2"),h:"المنطق بالدوائر: أشكال فن",ref:"كتاب الطالب ص "+B("21")+" و "+B("22"),
 body:`<p>تُمثَّل عبارة الوصل بـ<b>تقاطع</b> المجموعتين: العناصر المشتركة بينهما.</p>
 <p>وتُمثَّل عبارة الفصل بـ<b>اتحاد</b> المجموعتين: عناصرهما كلها.</p>
 <div class="law">${B("p ∧ q")} ← التقاطع<br>${B("p ∨ q")} ← الاتحاد</div>
 <div class="note">المستطيل المحيط بأشكال فن يمثل المجموعة الكلية. والدائرتان تقسمانها إلى ${B("4")} مناطق على الأكثر.</div>`},
{k:"الفصل ٦ · التحدي",h:"صيّاد الأنماط والعبارات",ref:"أسئلة من «تأكد» و«تدرب وحل المسائل» ص "+B("15")+" إلى "+B("17")+" و "+B("23"),
 body:`<p>ثمانية أسئلة من تمارين الدرسين. أجب عن كل سؤال مرة واحدة، ثم اقرأ السبب.</p>
 <ul class="plain">
  <li><b class="k-pat">التخمين</b>: عبارة تصل إليها من أمثلة محددة.</li>
  <li><b class="k-cx">المثال المضاد</b>: مثال واحد يكفي لإثبات خطأ التخمين.</li>
  <li><b class="k-neg">النفي</b> ${B("~p")}: عكس قيمة الصواب.</li>

 const short=H<470;document.body.classList.toggle("short",short);
 if(short){S.two=false;pw=Math.min(W-20,560);ph=Math.max(H-22,S.teacher?560:540);}
 const fs=Math.max(10.5,Math.min(pw/28,ph/37));
 book.style.setProperty("--pw",pw+"px");book.style.setProperty("--ph",ph+"px");book.style.setProperty("--fs",fs+"px");
 book.style.setProperty("--tilt",S.teacher?"0deg":S.two?"13deg":"5deg");
 if(!S.two&&S.s>=N&&S.side==="lab")S.side="text";
 update();
}
function update(){
 const pw=parseFloat(book.style.getPropertyValue("--pw"));
 book.style.setProperty("--shift",S.two?"0px":(S.side==="text"?-pw/2:pw/2)+"px");
 leaves.forEach((lf,i)=>lf.classList.toggle("active",i===S.s&&(S.two||S.side==="lab")));
 leaves.forEach((lf,i)=>{lf.classList.toggle("far",i<S.s-2||i>S.s+1);$(".front",lf).classList.toggle("live",i===S.s);$(".back",lf).classList.toggle("live",i===S.s-1);});
 $(".static.r .face").classList.toggle("live",S.s===0);
 $$("i",dots).forEach((d,i)=>d.classList.toggle("on",i===S.s));
 $("#prev").disabled=S.s===0&&(S.two||S.side==="text"||S.teacher);
 $("#next").disabled=S.teacher?S.s>=N-1:S.s>=N;
}
function turn(i,fwd,cb){
 const lf=leaves[i];S.busy=true;flipSound();lf.classList.add("turning");
 lf.style.animation=(fwd?"flipF":"flipB")+" .9s cubic-bezier(.45,.05,.4,1) both";
 lf.classList.toggle("flipped",fwd);
 let done=false;const fin=()=>{if(done)return;done=true;lf.style.animation="";lf.classList.remove("turning");S.busy=false;cb&&cb();};
 lf.addEventListener("animationend",fin,{once:true});setTimeout(fin,1100);
}
function next(){
 if(S.busy)return;
 if(S.teacher){if(S.s<N-1){const i=S.s;S.s++;update();turn(i,true,update);}return;}
 if(!S.two&&S.side==="text"&&S.s<N){S.side="lab";flipSoundSoft();update();return;}
 if(S.s<N){const i=S.s;S.s++;S.side="text";update();turn(i,true,update);}
}
function prev(){
 if(S.busy)return;
 if(S.teacher){if(S.s>0){S.s--;update();turn(S.s,false,update);}return;}
 if(!S.two&&S.side==="lab"){S.side="text";flipSoundSoft();update();return;}
 if(S.s>0){S.s--;S.side="lab";update();turn(S.s,false,update);}
}
function flipSoundSoft(){flipSound();}
$("#next").onclick=next;$("#prev").onclick=prev;
$("#mute").onclick=e=>{S.muted=!S.muted;e.currentTarget.textContent=S.muted?"🔇":"🔊";e.currentTarget.setAttribute("aria-pressed",S.muted);};
$("#teach").onclick=e=>{S.teacher=!S.teacher;document.body.classList.toggle("teacher",S.teacher);e.currentTarget.setAttribute("aria-pressed",S.teacher);e.currentTarget.textContent=S.teacher?"خروج من وضع المعلم":"وضع المعلم";
 if(S.teacher){if(S.s>=N){S.s=N-1;leaves[N-1].classList.remove("flipped");}S.side="lab";}
 layout();};
addEventListener("keydown",e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.key==="ArrowLeft")next();if(e.key==="ArrowRight")prev();});
let sx=null,sy=0;
$("#stage").addEventListener("pointerdown",e=>{sx=e.target.closest("input,button,select,.pop,.ctl")?null:e.clientX;sy=e.clientY;});
addEventListener("pointerup",e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){dx>0?next():prev();}});
addEventListener("resize",layout);
layout();
</script>
</body>
