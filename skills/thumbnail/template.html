<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@800&display=block" rel="stylesheet">
<style>
  /* 1280x720 YouTube thumbnail. Edit the variables, text and background. */
  :root {
    --bg: #0f172a;          /* fallback background */
    --accent: #facc15;      /* highlight word + badge */
    --text: #ffffff;
  }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Cairo", "Tajawal", "DejaVu Sans", sans-serif;
    background: var(--bg) url("background.jpg") center / cover no-repeat;
    position: relative;
  }
  /* darkens the text side so words stay readable on any photo */
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(to left, rgba(0,0,0,.85) 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,0) 75%);
  }
  .title {
    position: absolute; right: 64px; top: 50%; transform: translateY(-50%);
    width: 640px; margin: 0;
    color: var(--text); font-weight: 900; font-size: 104px; line-height: 1.15;
    text-shadow: 0 6px 0 rgba(0,0,0,.55), 0 0 24px rgba(0,0,0,.5);
  }
  .title .hl { color: var(--accent); }
  .badge {
    position: absolute; right: 64px; top: 56px;
    background: var(--accent); color: #111; font-weight: 900; font-size: 40px;
    padding: 6px 26px 10px; border-radius: 14px; transform: rotate(-3deg);
  }
  /* keep the bottom-right corner clear: YouTube draws the duration there */
</style>
</head>
<body>
  <div class="shade"></div>
  <div class="badge">جديد</div>
  <h1 class="title">كيف <span class="hl">تضاعف</span> مشاهداتك</h1>
</body>
</html>
