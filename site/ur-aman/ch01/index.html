<script>
'use strict';
// UR AMAN, chapter 1: the compliance monitoring and remediation workflow. Beat ids match narration.en.json.
// Every name, count and date drawn here is illustrative, as in the source explainer.
const CHAPTER = { number: 1, title: 'UR AMAN: extract, remediate, report', minutes: 3, language: 'en' };

/* ---------- the book's look ---------- */
const HEAD = '"Oswald","Avenir Next",Arial,sans-serif', SERIF = '"EB Garamond",Georgia,serif';
const INK = COL.chalk, PAPER = '#fffdf6';
const C = { red: bookSetting('--overdue'), amber: bookSetting('--soon'), green: bookSetting('--ok'), aman: bookSetting('--aman') };
const NB = ' ', thou = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NB);   // 2 899

/* ---------- chapter drawing helpers ---------- */
const head = (p, str, x, y, size = 44, o = {}) => T(p, str, { x, y, size, font: HEAD, weight: 600, ...o });
const serif = (p, str, x, y, size = 30, o = {}) => T(p, str, { x, y, size, font: SERIF, weight: 500, fill: COL.dim, ...o });
// a sheet of paper: local coordinates start at its top left corner
function sheet(p, x, y, w, hh, { stroke = INK, fill = PAPER, o = 1, s = 1 } = {}) {
  const g = G(p, { x, y, o, s });
  mk('rect', { x: 7, y: 8, width: w, height: hh, rx: 10, fill: INK, opacity: .13 }, g);
  mk('rect', { width: w, height: hh, rx: 10, fill, stroke, 'stroke-width': 2.5 }, g);
  return g;
}
// a coloured band along a sheet's top edge, with its title
function band(g, w, str, fill, sub) {
  mk('path', { d: `M1.5 64V11.5Q1.5 1.5 11.5 1.5H${w - 11.5}Q${w - 1.5} 1.5 ${w - 1.5} 11.5V64Z`, fill }, g);
  head(g, str, 28, 44, 32, { fill: PAPER });
  if (sub) T(g, sub, { x: w - 28, y: 42, size: 20, fill: PAPER, anchor: 'end', o: .85 });
}
// a status pill centred on (x, y); starts hidden, pop() brings it in
function pill(p, str, x, y, colr, { size = 20, on = false } = {}) {
  const w = str.length * size * .56 + 30, g = G(p, { x, y, s: on ? 1 : .4, o: on ? 1 : 0 });
  mk('rect', { x: -w / 2, y: -size * .85, width: w, height: size * 1.7, rx: size * .85, fill: PAPER, stroke: colr, 'stroke-width': 2.5 }, g);
  T(g, str, { x: 0, y: size * .34, size, fill: colr, weight: 700, anchor: 'middle' });
  return g;
}
// the three steps along the top; k is the one this beat belongs to
function stepper(p, k) {
  const g = G(p, { o: 0 });
  ['Extract', 'Remediate', 'Report'].forEach((s, i) => {
    const on = i === k, x = 90 + i * 250;
    mk('circle', { cx: x + 18, cy: 78, r: 18, fill: on ? COL.task : 'none', stroke: on ? COL.task : COL.faint, 'stroke-width': 2.5 }, g);
    T(g, String(i + 1), { x: x + 18, y: 86, size: 22, weight: 700, anchor: 'middle', fill: on ? PAPER : COL.dim });
    head(g, s.toUpperCase(), x + 48, 88, 26, { fill: on ? COL.task : COL.dim });
    if (i < 2) mk('path', { d: `M${x + 196} 78h34`, stroke: COL.faint, 'stroke-width': 2.5 }, g);
  });
  show(g, .2);
  return g;
}
function person(p, x, y, label, colr = INK) {
  const g = G(p, { x, y, s: .4, o: 0 });
  mk('path', { d: 'M-46 34Q-46 -16 0 -16Q46 -16 46 34Z', fill: PAPER, stroke: colr, 'stroke-width': 3 }, g);
  mk('circle', { cx: 0, cy: -46, r: 26, fill: PAPER, stroke: colr, 'stroke-width': 3 }, g);
  T(g, label, { x: 0, y: 72, size: 24, weight: 600, anchor: 'middle' });
  return g;
}
function envelope(p, x, y, o = 0) {
  const g = G(p, { x, y, o });
  mk('rect', { x: -32, y: -21, width: 64, height: 42, rx: 4, fill: PAPER, stroke: INK, 'stroke-width': 2.5 }, g);
  mk('path', { d: 'M-32 -21L0 5L32 -21', fill: 'none', stroke: INK, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, g);
  return g;
}
// a file exported from a system: a small sheet with its name
function fileCard(p, x, y, name, w = 520, hh = 230) {
  const g = sheet(p, x, y, w, hh, { o: 0 });
  mk('rect', { x: 22, y: 20, width: 66, height: 34, rx: 6, fill: C.green }, g);
  T(g, 'XLSX', { x: 55, y: 44, size: 18, weight: 700, fill: PAPER, anchor: 'middle' });
  T(g, name, { x: 104, y: 46, size: 24, weight: 600 });
  return g;
}
// bars of days open, to one scale; rows = [label, days]. Returns the bars and their day labels.
function dayBars(g, rows, { x0, y0, step, px, hh = 30, size = 22, labelX = 30 }) {
  return rows.map(([label, d], i) => {
    const y = y0 + i * step;
    T(g, label, { x: labelX, y: y + hh * .72, size });
    const bar = mk('rect', { x: x0, y, width: 0, height: hh, rx: 4, fill: COL.dim }, g);
    const str = d + (d === 1 ? ' day' : ' days'), n = G(g, { o: 0 });      // on a paper backing, so a limit line never cuts it
    mk('rect', { x: x0 + d * px + 6, y, width: str.length * size * .56 + 12, height: hh, fill: PAPER }, n);
    const nt = T(n, str, { x: x0 + d * px + 12, y: y + hh * .72, size, weight: 600 });
    return { bar, n, nt, d, w: d * px };
  });
}
const raise = (g, bars) => bars.forEach(b => g.appendChild(b.n));   // day labels above a line drawn after them
const CASES = [['Email · Employee A', 7], ['USB & Print · Employee B', 3], ['Web · Employee C', 9],
  ['Email · Employee D', 2], ['USB & Print · Employee E', 6], ['Web · Employee F', 1]];
const QCASES = [['Email · Employee K', 4], ['Web · Employee L', 5], ['USB & Print · Employee M', 8], ['Email · Employee N', 2]];
const DEPTS = [['UR Producing Dept', 96, 'ok'], ['UR Drilling 1 Dept', 71, 'over'], ['UR Completion Operations Dept', 88, 'soon'],
  ['UR Data Mgmt & Digital Portfolio Div', 94, 'ok'], ['UR Exploration & Characterization Dept', 64, 'over'], ['UR Logistics & Svcs Div', 85, 'soon']];
const STATUS = { ok: ['Compliant', C.green], over: ['Overdue', C.red], soon: ['Expiring soon', C.amber] };
const TESTED = 2899, PASSED = 2163, NEUTRAL = 735, FAILED = 1;
const pct = n => (n / TESTED * 100).toFixed(1) + NB + '%';

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'UR AMAN', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'UR ISA GROUP SUPPORT  ·  HOW IT WORKS', { x: 800, y: 215, size: 24, fill: COL.dim, anchor: 'middle', weight: 600 });
    head(g, 'UR AMAN', 800, 370, 150, { anchor: 'middle' });
    serif(g, 'UR Awareness Monitoring Alerts and Notification', 800, 440, 38, { anchor: 'middle' });
    mk('path', { d: 'M700 478H900', stroke: COL.task, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = G(scene);
    [['1', 'Extract', 'training, forms, open cases'], ['2', 'Remediate', 'automatic reminders'], ['3', 'Report', 'results and KPI status']].forEach(([n, s, sub], i) => {
      const t0 = m('sub') + i * .75, c = sheet(r, 205 + i * 410, 560, 370, 150, { o: 0 });
      put(c, { y: 580 });
      mk('circle', { cx: 50, cy: 54, r: 24, fill: COL.task }, c);
      T(c, n, { x: 50, y: 64, size: 28, weight: 700, fill: PAPER, anchor: 'middle' });
      head(c, s, 92, 68, 40);
      T(c, sub, { x: 30, y: 118, size: 21, fill: COL.dim });
      tw(c, { o: 1, y: 560 }, t0, .6, out);
      if (i < 2) draw(path(r, `M${585 + i * 410} 635h20`, { stroke: INK, 'stroke-width': 3 }, { d: 0 }), t0 + .5, .3);
    });
    tw(g, { o: 0, y: -24 }, D - .5, .5); hide(r, D - .5, .5);
  }],

  ['extract', 'Extract the records', (m) => {
    const p = panel(0);
    stepper(p, 0);
    const dash = sheet(p, 90, 150, 700, 620, { o: 0 });
    show(dash, .2);
    band(dash, 700, 'ISA Dashboard', '#22324a');
    T(dash, 'MANDATORY TRAINING', { x: 34, y: 116, size: 19, weight: 700, fill: COL.dim });
    T(dash, 'POLICY ACKNOWLEDGEMENTS', { x: 34, y: 336, size: 19, weight: 700, fill: COL.dim });
    const rows = [['Information Essentials', 'completion history', 160, 'c1', 0], ['Phishing Course', 'completion history', 222, 'c2', 0],
      ['9595', 'Computer Use Policy', 380, 'f1', 1], ['9696', 'Computer Use Policy', 442, 'f2', 1]];
    rows.forEach(([a, b, y]) => {
      mk('path', { d: `M34 ${y + 22}H666`, stroke: COL.faint, 'stroke-width': 1.5 }, dash);
      T(dash, a, { x: 34, y, size: 27, weight: 600 });
      T(dash, b, { x: 666, y, size: 22, fill: COL.dim, anchor: 'end' });
    });
    for (let i = 0; i < 3; i++) mk('rect', { x: 34, y: 506 + i * 34, width: 420 - i * 70, height: 12, rx: 6, fill: COL.faint, opacity: .55 }, dash);
    const files = [fileCard(p, 960, 190, 'completion_history.xlsx'), fileCard(p, 960, 500, 'policy_acknowledgements.xlsx')];
    [['hist', 300], ['pol', 610]].forEach(([mark, y], i) => {
      draw(path(p, `M800 ${y}H940M922 ${y - 14}L940 ${y}L922 ${y + 14}`, { stroke: COL.task, 'stroke-width': 4 }, { d: 0 }), m(mark), .5);
      put(files[i], { x: 990 }); tw(files[i], { o: 1, x: 960 }, m(mark, .2), .5, out);
    });
    rows.forEach(([a, , y, mark, f], i) => {            // each record leaves its row and lands in the exported file
      const t0 = m(mark), hi = mk('rect', { x: 100, y: 150 + y - 34, width: 680, height: 50, rx: 8, fill: COL.task }, p);
      put(hi, { o: 0 }); tw(hi, { o: .16 }, t0, .25); hide(hi, t0 + 1.1, .5);
      const copy = T(p, a, { x: 124, y: 150 + y, size: 27, weight: 600, fill: COL.task, o: 0 });
      show(copy, t0, .2);
      tw(copy, { x: 990, y: (f ? 500 : 190) + 118 + (i % 2) * 56 }, t0 + .25, .8, io);
      const tick = path(p, 'M0 0l9 9l16 -19', { stroke: C.green, 'stroke-width': 4 }, { d: 0, x: 1420, y: (f ? 500 : 190) + 108 + (i % 2) * 56 });
      draw(tick, t0 + 1.05, .3);
    });
  }],

  ['verify', 'Verify the dates', (m, D) => {
    const p = panel(0);
    stepper(p, 0);
    head(p, 'Verify every date against today', 90, 200, 46);
    const X = d => 240 + (d + 30) * 10.5, Y = 560;           // one scale: 10.5 px a day, from 30 days ago to 90 ahead
    const over = mk('rect', { x: X(-30), y: Y - 300, width: X(0) - X(-30), height: 300, fill: C.red }, p);
    const soon = mk('rect', { x: X(0), y: Y - 300, width: X(30) - X(0), height: 300, fill: C.amber }, p);
    put(over, { o: 0 }); put(soon, { o: 0 });
    const axis = path(p, `M${X(-30)} ${Y}H${X(90)}`, { stroke: INK, 'stroke-width': 3 }, { d: 0 });
    draw(axis, .2, .7);
    [[-30, '30 days ago'], [0, 'today'], [30, 'in 30 days'], [60, 'in 60 days'], [90, 'in 90 days']].forEach(([d, s]) => {
      const g = G(p, { o: 0 });
      mk('path', { d: `M${X(d)} ${Y - (d ? 10 : 320)}V${Y + 10}`, stroke: INK, 'stroke-width': d ? 2.5 : 3.5 }, g);
      T(g, s, { x: X(d), y: Y + 46, size: d ? 22 : 26, weight: d ? 500 : 700, anchor: 'middle', fill: d ? COL.dim : INK });
      show(g, .5);
    });
    const recs = [[-18, 'Phishing Course'], [-6, '9696 form'], [9, 'Information Essentials'], [22, '9595 form'], [64, 'Phishing Course']];
    const dots = recs.map(([d, s], i) => {
      const yy = Y - 96 - [0, 1, 1, 0, 0][i] * 96, g = G(p, { o: 0, y: 14 });
      mk('path', { d: `M${X(d)} ${Y}V${yy}`, stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '5 5' }, g);
      const c = mk('circle', { cx: X(d), cy: yy, r: 13, fill: INK }, g);
      T(g, s, { x: X(d) + (d < 0 ? -22 : 22), y: yy + 8, size: 23, weight: 600, anchor: d < 0 ? 'end' : 'start' });
      tw(g, { o: 1, y: 0 }, m('exp') + i * .13, .4, out);
      return { c, d };
    });
    const label = (str, x, colr, t0) => { const e = head(p, str, x, Y + 110, 34, { fill: colr, anchor: 'middle', o: 0 }); show(e, t0); };
    tw(over, { o: .13 }, m('over'), .4); label('OVERDUE', (X(-30) + X(0)) / 2, C.red, m('over'));
    tw(soon, { o: .16 }, m('soon'), .4); label('UPCOMING DEADLINE', (X(0) + X(30)) / 2 + 30, C.amber, m('soon'));
    dots.forEach(({ c, d }) => {
      if (d < 0) { tw(c, { c_fill: C.red }, m('over'), .4); }
      else if (d <= 30) { tw(c, { c_fill: C.amber }, m('soon'), .4); }
      else tw(c, { c_fill: C.green }, m('soon', .7), .4);
    });
    label('VALID', X(64), C.green, m('soon', .7));
    serif(p, 'illustrative dates', 1510, 200, 24, { anchor: 'end' });
  }],

  ['dlp', 'Open DLP cases', (m) => {
    const p = panel(0);
    stepper(p, 0);
    const con = sheet(p, 90, 150, 1010, 650, { o: 0 });
    show(con, .2);
    band(con, 1010, 'Antileak · DLP Console', '#7c2a24', 'open cases requiring closure');
    T(con, 'DAYS SINCE THE FIRST NOTIFICATION EMAIL', { x: 380, y: 622, size: 19, weight: 700, fill: COL.dim });
    const x0 = 380, px = 56, bars = dayBars(con, CASES, { x0, y0: 142, step: 66, px });
    mk('path', { d: `M${x0} 132V552H${x0 + 570}`, fill: 'none', stroke: INK, 'stroke-width': 2.5 }, con);
    for (let d = 0; d <= 10; d++) T(con, String(d), { x: x0 + d * px, y: 586, size: 20, fill: COL.dim, anchor: 'middle' });
    bars.forEach(({ bar, n, w }, i) => { tw(bar, { a_width: w }, m('open') + i * .12, .6, out); show(n, m('open') + i * .12 + .45, .3); });
    const lim = G(con, { o: 0 });
    draw(path(con, `M${x0 + 5 * px} 552V96`, { stroke: C.red, 'stroke-width': 4, 'stroke-dasharray': '.03 .02' }, { d: 0 }), m('five'), .6);
    head(lim, '5-DAY LIMIT', x0 + 5 * px + 14, 112, 26, { fill: C.red });
    show(lim, m('five', .3)); raise(con, bars);
    bars.forEach(({ bar, nt, d }) => { if (d > 5) { tw(bar, { c_fill: C.red }, m('five', .7), .4); tw(nt, { c_fill: C.red }, m('five', .7), .4); } });
    const note = G(p, { o: 0, x: 20 });
    head(note, 'Resolve every case', 1150, 300, 40);
    head(note, 'within 5 days', 1150, 356, 40, { fill: C.red });
    ['of the first notification', 'email sent to the user.'].forEach((s, i) => serif(note, s, 1150, 410 + i * 40, 31));
    const env = envelope(note, 1190, 520, 1);
    T(note, 'day 0', { x: 1190, y: 580, size: 22, weight: 600, anchor: 'middle', fill: COL.dim });
    mk('path', { d: 'M1236 520H1396M1380 508L1396 520L1380 532', fill: 'none', stroke: INK, 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, note);
    mk('path', { d: 'M1436 548V492M1436 494h44l-12 14l12 14h-44', fill: PAPER, stroke: C.red, 'stroke-width': 3, 'stroke-linejoin': 'round' }, note);
    T(note, 'day 5', { x: 1452, y: 580, size: 22, weight: 600, anchor: 'middle', fill: C.red });
    tw(note, { o: 1, x: 0 }, m('five', .3), .6, out);
    serif(p, 'illustrative data', 1090, 138, 22, { anchor: 'end' });
  }],

  ['q1', 'Quick check', () => {
    const p = panel(0);
    stepper(p, 0);
    const con = sheet(p, 200, 130, 1200, 470, { o: 0 });
    show(con, .2);
    band(con, 1200, 'Antileak · DLP Console', '#7c2a24', 'days since the first notification email');
    const x0 = 440, px = 80, bars = dayBars(con, QCASES, { x0, y0: 110, step: 74, px, hh: 38, size: 25 });
    mk('path', { d: `M${x0} 96V402H${x0 + 720}`, fill: 'none', stroke: INK, 'stroke-width': 2.5 }, con);
    for (let d = 0; d <= 9; d++) T(con, String(d), { x: x0 + d * px, y: 436, size: 21, fill: COL.dim, anchor: 'middle' });
    mk('path', { d: `M${x0 + 5 * px} 402V84`, stroke: C.red, 'stroke-width': 4, 'stroke-dasharray': '12 8' }, con);
    head(con, '5-DAY LIMIT', x0 + 5 * px + 14, 100, 24, { fill: C.red });
    raise(con, bars);
    bars.forEach(({ bar, n, w }) => { put(bar, { a_width: w }); put(n, { o: 1 }); });
    S.q1 = bars.map(({ bar }, i) => ({ el: bar, box: [214, 130 + 100 + i * 74, 1172, 58], label: QCASES[i][0] + ', ' + QCASES[i][1] + ' days' }));
  }, { ask: done => quiz(BAND, [{
    id: 'c-limit', prompt: ['Click the case that is past the five-day limit.'],
    build: pickEls(S.q1, 2, 'Eight days is more than five: this case should already be closed.',
      i => i === 1 ? 'Five days is exactly on the limit, so this case is still within it.' : 'This bar ends before the red line: the case is still within five days.',
      () => fx(S.q1[2].el, { c_fill: C.red }, 0, .4)),
  }], done) }],

  ['upload', 'Upload to UR AMAN', (m) => {
    const p = panel(0);
    stepper(p, 1);
    const tool = sheet(p, 480, 160, 330, 500, { stroke: C.aman, o: 0 });
    show(tool, .2);
    band(tool, 330, 'UR AMAN', C.aman);
    T(tool, 'UPLOAD COMPLIANCE DATA', { x: 26, y: 112, size: 18, weight: 700, fill: COL.dim });
    mk('rect', { x: 26, y: 132, width: 278, height: 250, rx: 10, fill: 'none', stroke: C.aman, 'stroke-width': 2.5, 'stroke-dasharray': '10 8' }, tool);
    const loaded = G(tool, { o: 0 });
    draw(path(tool, 'M135 250l22 22l38 -46', { stroke: C.green, 'stroke-width': 7 }, { d: 0 }), m('up', 1.5), .4);
    T(loaded, '3 reports loaded', { x: 165, y: 330, size: 24, weight: 600, anchor: 'middle' });
    show(loaded, m('up', 1.5));
    ['completion_history', 'policy_acknowledgements', 'dlp_open_cases'].forEach((s, i) => {      // the three reports go into the tool
      const f = sheet(p, 90, 200 + i * 130, 320, 96, { o: 0 });
      mk('rect', { x: 16, y: 16, width: 58, height: 30, rx: 6, fill: C.green }, f);
      T(f, 'XLSX', { x: 45, y: 38, size: 16, weight: 700, fill: PAPER, anchor: 'middle' });
      T(f, s, { x: 16, y: 76, size: 22, weight: 600 });
      show(f, .2 + i * .1);
      tw(f, { x: 566, y: 380 + i * 8, s: .5 }, m('up') + i * .28, .8, io); hide(f, m('up') + i * .28 + .55, .3);
    });
    const tab = sheet(p, 880, 160, 630, 600, { o: 0 });
    band(tab, 630, 'Training status by department', '#22324a');
    draw(path(p, 'M818 410H866M850 396L866 410L850 424', { stroke: C.aman, 'stroke-width': 4 }, { d: 0 }), m('calc', -.1), .4);
    put(tab, { x: 910 }); tw(tab, { o: 1, x: 880 }, m('calc'), .5, out);
    DEPTS.forEach(([name, v, sk], i) => {
      const y = 112 + i * 80, t0 = m('calc') + .35 + i * .14, [word, colr] = STATUS[sk];
      T(tab, name, { x: 28, y, size: 22, weight: 600 });
      mk('rect', { x: 28, y: y + 14, width: 320, height: 14, rx: 7, fill: COL.faint, opacity: .5 }, tab);
      const bar = mk('rect', { x: 28, y: y + 14, width: 0, height: 14, rx: 7, fill: COL.dim }, tab);
      const n = T(tab, '0 %', { x: 420, y: y + 28, size: 22, weight: 600, anchor: 'end' });
      tw(bar, { a_width: 3.2 * v }, t0, .8, out);
      prog(q => { n.textContent = Math.round(q * v) + NB + '%'; }, t0, .8, out);
      const pl = pill(tab, word, 522, y + 12, colr, { size: 19 });
      pop(pl, m('flag') + i * .12); tw(bar, { c_fill: colr }, m('flag') + i * .12, .4);
    });
    serif(p, 'illustrative data', 1510, 148, 22, { anchor: 'end' });
  }],

  ['filter', 'Filter and highlight', (m) => {
    const p = panel(0);
    stepper(p, 1);
    const tab = sheet(p, 90, 150, 860, 630, { stroke: C.aman, o: 0 });
    show(tab, .2);
    band(tab, 860, 'UR AMAN · compliance by requirement', C.aman);
    const chips = ['IS Essentials', 'Phishing Course', '9595 / 9696'].map((s, i) => {
      const g = G(tab, { x: 34 + i * 220, y: 88 });
      const r = mk('rect', { width: 200, height: 44, rx: 22, fill: PAPER, stroke: C.aman, 'stroke-width': 2.5 }, g);
      const t = T(g, s, { x: 100, y: 30, size: 21, weight: 700, anchor: 'middle', fill: C.aman });
      return { g, r, t };
    });
    chips.slice(0, 2).forEach(c => tw(c.g, { o: .35 }, m('filt'), .4));
