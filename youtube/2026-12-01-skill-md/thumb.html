<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=block" rel="stylesheet">
<style>
:root{--accent:#facc15;--text:#fff}
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{font-family:"Cairo","Tajawal","DejaVu Sans",sans-serif;position:relative;
 background:radial-gradient(ellipse at 25% 55%,#1e3a5f 0%,#0b1220 60%,#05080f 100%)}
.title{position:absolute;margin:0;color:var(--text);font-weight:900;line-height:1.08;
 text-shadow:0 8px 0 rgba(0,0,0,.6),0 0 30px rgba(0,0,0,.6)}
.title .hl{display:inline-block;background:var(--accent);color:#111;text-shadow:none;
 padding:0 .18em .08em;border-radius:.12em;transform:rotate(-2deg)}
.win{position:absolute;direction:ltr;background:#111827;border:4px solid #334155;border-radius:26px;
 box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden;transform:rotate(-3deg)}
.bar{background:#1f2937;display:flex;align-items:center;gap:14px;padding:18px 22px;
 font:700 30px ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1}
.dot{width:20px;height:20px;border-radius:50%}
.body{padding:.7em .6em;font:700 1em ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;gap:.45em}
.ln{color:#475569;white-space:nowrap}
.lit{background:var(--accent);color:#111;border-radius:.25em;padding:.25em .4em;margin:0 -.4em;
 box-shadow:0 0 40px rgba(250,204,21,.55);font-size:1.25em}
.bars{display:flex;flex-direction:column;gap:.5em;margin-top:.3em}
.bars i{display:block;height:.5em;border-radius:.25em;background:#283548}
.title{right:50px;top:50%;transform:translateY(-54%);font-size:136px}.win{left:60px;top:130px;width:520px}.body{font-size:40px}
</style></head><body>
<div class="win"><div class="bar"><span class="dot" style="background:#ef4444"></span><span class="dot" style="background:#f59e0b"></span><span class="dot" style="background:#22c55e"></span><span style="margin-left:14px">SKILL.md</span></div>
<div class="body"><div class="ln">name: thumbnail</div><div class="ln lit">description: ...</div>
<div class="bars"><i style="width:90%"></i><i style="width:70%"></i><i style="width:82%"></i><i style="width:55%"></i></div></div></div>
<h1 class="title">سطر واحد<br><span class="hl">يقرّر</span></h1>
</body></html>
